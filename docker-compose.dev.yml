version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: guardrails-postgres
    environment:
      POSTGRES_USER: guardrails
      POSTGRES_PASSWORD: guardrails
      POSTGRES_DB: guardrails_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardrails"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - guardrails-network

  redis:
    image: redis:7-alpine
    container_name: guardrails-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - guardrails-network

volumes:
  postgres_data:
  redis_data:

networks:
  guardrails-network:
    driver: bridge

