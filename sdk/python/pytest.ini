[pytest]
# Pytest configuration for Guardrails SDK

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    integration: Integration tests that require a running backend
    unit: Unit tests that use mocks
    slow: Tests that take a long time to run

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Async support
asyncio_mode = auto

# Coverage (when using pytest-cov)
# --cov=guardrails_sdk
# --cov-report=term-missing
# --cov-report=html

